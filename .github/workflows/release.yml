name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: Build and test ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
            profile: Windows-Zip
          - runner: ubuntu-22.04
            rid: linux-x64
            profile: Linux-AppImage
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      PUBLISH_PROFILE: ${{ matrix.profile }}
      RELEASE_RID: ${{ matrix.rid }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        run: |
          . ./build/ReleaseVersion.ps1
          $releaseVersion = Get-DesktopReleaseVersion -Version $env:RELEASE_TAG -Tag
          [xml]$project = Get-Content -LiteralPath 'src/sip-testing-tool-avalonia/sip-testing-tool-avalonia.csproj' -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($releaseVersion.Version -cne $version) {
            throw "Tag $env:RELEASE_TAG does not match project version $version."
          }

      - name: Install .NET 10
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Select the installed SDK
        env:
          SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          @{
            sdk = @{
              version = $env:SDK_VERSION
              rollForward = 'latestPatch'
              allowPrerelease = $false
            }
          } | ConvertTo-Json | Set-Content -LiteralPath 'global.json'

      - name: Install Linux test and packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1 libx11-6 libice6 libsm6 squashfs-tools

      - name: Verify release versions and packaging
        run: ./build/TestReleaseVersion.ps1

      - name: Verify publish profiles
        run: dotnet msbuild build/VerifyPublishPaths.proj

      - name: Run Avalonia tests
        run: dotnet test tests/sip-desktop-tests/sip-desktop-tests.csproj --configuration Release

      - name: Run shared protocol and Windows Forms tests
        if: runner.os == 'Windows'
        run: dotnet test tests/sip-tests/sip-tests.csproj --configuration Release

      - name: Publish and package
        run: dotnet publish src/sip-testing-tool-avalonia/sip-testing-tool-avalonia.csproj --configuration Release -p:PublishProfile=$env:PUBLISH_PROFILE

      - name: Verify release downloads
        run: ./build/VerifyDesktopRelease.ps1 -Directory "artifacts/avalonia/releases/$env:RELEASE_RID" -RuntimeIdentifier $env:RELEASE_RID -Version ($env:RELEASE_TAG.Substring(1))

      - name: Save release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.rid }}
          path: artifacts/avalonia/releases/${{ matrix.rid }}/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  release:
    name: Prepare draft release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download both sets of release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: artifacts/release

      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          . ./build/ReleaseVersion.ps1
          $releaseVersion = Get-DesktopReleaseVersion -Version $env:RELEASE_TAG -Tag
          $releaseOptions = @('--prerelease=' + $releaseVersion.IsPrerelease.ToString().ToLowerInvariant())
          if ($releaseVersion.IsPrerelease) { $releaseOptions += '--latest=false' }
          foreach ($rid in @('win-x64', 'linux-x64')) {
            ./build/VerifyDesktopRelease.ps1 -Directory "artifacts/release/desktop-$rid" -RuntimeIdentifier $rid -Version ($env:RELEASE_TAG.Substring(1))
          }
          $assets = @(Get-ChildItem -LiteralPath 'artifacts/release' -Recurse -File)
          $duplicates = @($assets | Group-Object Name | Where-Object Count -gt 1)
          if ($duplicates.Count -gt 0) {
            throw "Release asset names must be unique: $($duplicates.Name -join ', ')"
          }
          $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw 'This release is already published. Create a new version instead of replacing published assets.'
            }
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft @releaseOptions
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the draft release classification.' }
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "SIP Testing Tool $env:RELEASE_TAG" --generate-notes @releaseOptions
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          }
          $assetPaths = @($assets.FullName)
          gh release upload $env:RELEASE_TAG @assetPaths --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload all release assets. The release remains a draft.' }
