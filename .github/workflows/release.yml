name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out version validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the triggering tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          . ./build/ReleaseVersion.ps1
          $releaseVersion = Get-DesktopReleaseVersion -Version $env:RELEASE_TAG -Tag
          "version=$($releaseVersion.Version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($releaseVersion.IsPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build:
    name: Build and test ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
            profile: Windows-Zip
          - runner: ubuntu-22.04
            rid: linux-x64
            profile: Linux-AppImage
          - runner: macos-15
            rid: osx-arm64
            profile: macOS-arm64
          - runner: macos-15-intel
            rid: osx-x64
            profile: macOS-x64
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      PUBLISH_PROFILE: ${{ matrix.profile }}
      RELEASE_RID: ${{ matrix.rid }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Select the installed SDK
        env:
          SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          @{
            sdk = @{
              version = $env:SDK_VERSION
              rollForward = 'latestPatch'
              allowPrerelease = $false
            }
          } | ConvertTo-Json | Set-Content -LiteralPath 'global.json'

      - name: Install Linux test and packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1 libx11-6 libice6 libsm6 squashfs-tools

      - name: Verify release versions and packaging
        run: ./build/TestReleaseVersion.ps1

      - name: Verify publish profiles
        run: dotnet msbuild build/VerifyPublishPaths.proj

      - name: Verify standalone Mac packaging
        if: runner.os == 'macOS'
        shell: bash
        run: bash build/TestMacBuild.sh

      - name: Run Avalonia tests
        env:
          EXPECTED_DESKTOP_VERSION: ${{ needs.version.outputs.version }}
        run: dotnet test tests/sip-desktop-tests/sip-desktop-tests.csproj --configuration Release -p:Version=$env:RELEASE_VERSION

      - name: Verify the compiled application version
        run: ./build/VerifyDesktopRelease.ps1 -ApplicationPath src/sip-testing-tool-avalonia/bin/Release/net10.0/sip-testing-tool-avalonia.dll -Version $env:RELEASE_VERSION

      - name: Run shared protocol and Windows Forms tests
        if: runner.os == 'Windows'
        run: dotnet test tests/sip-tests/sip-tests.csproj --configuration Release -p:Version=$env:RELEASE_VERSION

      - name: Publish and package
        run: dotnet publish src/sip-testing-tool-avalonia/sip-testing-tool-avalonia.csproj --configuration Release -p:PublishProfile=$env:PUBLISH_PROFILE -p:Version=$env:RELEASE_VERSION

      - name: Package macOS release
        if: runner.os == 'macOS'
        run: ./build/PackageDesktop.ps1 -PublishDirectory "artifacts/avalonia/publish/$env:RELEASE_RID" -OutputDirectory "artifacts/avalonia/releases/$env:RELEASE_RID" -RuntimeIdentifier $env:RELEASE_RID -Version $env:RELEASE_VERSION

      - name: Verify release downloads
        run: ./build/VerifyDesktopRelease.ps1 -Directory "artifacts/avalonia/releases/$env:RELEASE_RID" -RuntimeIdentifier $env:RELEASE_RID -Version $env:RELEASE_VERSION

      - name: Save release package as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.rid }}
          path: artifacts/avalonia/releases/${{ matrix.rid }}/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all workflow packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: artifacts/release

      - name: Verify packages and publish with GitHub-native digests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          foreach ($rid in @('win-x64', 'linux-x64', 'osx-arm64', 'osx-x64')) {
            ./build/VerifyDesktopRelease.ps1 -Directory "artifacts/release/desktop-$rid" -RuntimeIdentifier $rid -Version $env:RELEASE_VERSION
          }
          ./build/PublishDesktopRelease.ps1 -Directory artifacts/release -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -Version $env:RELEASE_VERSION -ExpectedCommit $env:RELEASE_COMMIT
