name: Desktop tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  packages:
    name: Verify package (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
            profile: Windows-Zip
          - runner: ubuntu-22.04
            rid: linux-x64
            profile: Linux-AppImage
          - runner: macos-15
            rid: osx-arm64
            profile: macOS-arm64
          - runner: macos-15-intel
            rid: osx-x64
            profile: macOS-x64
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_RID: ${{ matrix.rid }}
      PUBLISH_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Select the installed SDK
        env:
          SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          @{ sdk = @{ version = $env:SDK_VERSION; rollForward = 'latestPatch'; allowPrerelease = $false } } |
            ConvertTo-Json | Set-Content -LiteralPath global.json

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools

      - name: Verify release versions, packages and mocked publication
        run: ./build/TestReleaseVersion.ps1

      - name: Verify publish profiles
        run: dotnet msbuild build/VerifyPublishPaths.proj

      - name: Verify standalone Mac packaging
        if: runner.os == 'macOS'
        shell: bash
        run: bash build/TestMacBuild.sh

      - name: Publish a development package without a release tag
        run: dotnet publish src/sip-testing-tool/sip-testing-tool.csproj --configuration Release -p:PublishProfile=$env:PUBLISH_PROFILE

      - name: Package macOS download
        if: runner.os == 'macOS'
        run: ./build/PackageDesktop.ps1 -PublishDirectory "artifacts/avalonia/publish/$env:RELEASE_RID" -OutputDirectory "artifacts/avalonia/releases/$env:RELEASE_RID" -RuntimeIdentifier $env:RELEASE_RID -Version '0.0.0-dev'

      - name: Verify the single package and embedded version
        run: ./build/VerifyDesktopRelease.ps1 -Directory "artifacts/avalonia/releases/$env:RELEASE_RID" -RuntimeIdentifier $env:RELEASE_RID -Version '0.0.0-dev'

  desktop:
    name: Avalonia tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Select the installed SDK
        shell: bash
        env:
          SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          printf '{"sdk":{"version":"%s","rollForward":"latestPatch","allowPrerelease":false}}\n' "$SDK_VERSION" > global.json

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1 libx11-6 libice6 libsm6

      - name: Run complete Avalonia desktop suite
        run: >-
          dotnet test tests/sip-desktop-tests/sip-desktop-tests.csproj
          --configuration Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=desktop-tests.trx"
          --results-directory artifacts/test-results

      - name: Repeat scrolling and focus regressions
        shell: bash
        run: |
          for iteration in 1 2 3; do
            dotnet test tests/sip-desktop-tests/sip-desktop-tests.csproj \
              --configuration Release --no-build --no-restore \
              --filter 'FullyQualifiedName~PropertiesRetainFocusWhenTheLogScrollsOrResizes|FullyQualifiedName~MessageExpandersFollowScrollingResizingAndClearingWithoutLosingFocus|FullyQualifiedName~PartiallyVisibleMessageHeadersKeepTheirExpanders' \
              --logger "trx;LogFileName=log-navigation-$iteration.trx" \
              --results-directory artifacts/test-results
          done

      - name: Run shared protocol and console suite
        run: >-
          dotnet test tests/sip-tests/sip-tests.csproj
          --configuration Release
          --logger "trx;LogFileName=protocol-tests.trx"
          --results-directory artifacts/test-results

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ runner.os }}-desktop-test-results
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7
